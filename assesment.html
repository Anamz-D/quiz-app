<body>
  <div id="loading-wrapper"></div>
  <header>
    <nav-bar></nav-bar>
  </header>
  <main class="container">
    <h1>Available Assessments</h1>
    <input type="text" class="search-bar" placeholder="Search assessments...">
    <div class="assessments" id="assessments-container">
      <div class="assessment-card">
        <h3>CSC's</h3>

      </div>
      <div class="assessment-card">
        <h3>Physics</h3>
        <p>Newton's Laws of Motion</p>
        <p>Duration: 5 minutes</p>
        <a href="/quiz.html?category=" class="assessment-btn">Start Assessment</a>
      </div>
      <div class="assessment-card">
        <h3>Maths</h3>
        <p>Balancing Equations</p>
        <p>Duration: 5 minutes</p>
        <a href="/quiz.html?category=19" class="assessment-btn">Start Assessment</a>
      </div>
      <div class="assessment-card">
        <h3>Biology</h3>
        <p>Photosynthesis Process</p>
        <p>Duration: 5 minutes</p>
        <a href="/quiz.html?category=" class="assessment-btn">Start Assessment</a>
      </div>
    </div>

  <script type="module">
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
    import { db } from "../assets/js/firebase.js";
    import { isAuthenticated } from "./assets/js/index.js";

    window.addEventListener('DOMContentLoaded', async () => {
      const loadingWrapper = document.getElementById("loading-wrapper");
      loadingWrapper.style.display = "block"; // Show loader by default

      try {
        await isAuthenticated();
        loadingWrapper.style.display = "none";
        renderAssessments();

      } catch (err) {
        console.warn("Access blocked:", err.message);

      }
    });


    async function fetchAssessments() {
      const querySnapshot = await getDocs(collection(db, "assessments"));
      const quizzes = [];
      querySnapshot.forEach((doc) => {
        quizzes.push({ id: doc.id, ...doc.data() });
      });
      return quizzes;
    }

    async function renderAssessments() {
      const container = document.getElementById("assessments-container");
      container.innerHTML = "Loading...";

      const quizzes = await fetchAssessments();
      

      container.innerHTML = quizzes.map(q => `
          <div class="assessment-card">
            <h3>${q.title}</h3>
            <p>${q.description}</p>
            <a href="/quiz.html?id=${q.id}" class="assessment-btn">Start Assessment</a>
          </div>
        `).join('');

    }


  </script>
