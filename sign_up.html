<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Assesment System</title>
    <link rel="stylesheet" href="./assets/styles/base.css">
    <link rel="stylesheet" href="./assets/styles/accesspage.css">
</head>

<body>

    <main>

        <div class="form-container">
            <h1>SIGN UP HERE</h1>

            <form id="signup-form" method="POST">
                <!-- <label for="signup-name">Full Name</label> -->
                <input type="text" id="name" name="fullname" placeholder=" Full Name" required><br>

                <!-- <label for="signup-email">Email</label> -->
                <input type="email" id="email" name="email" placeholder=" Email" required><br>


                <!-- <label for="signup-password">Password</label> -->
                <input type="password" id="password" name="password" placeholder=" Password" required><br>


                <!-- <label for="signup-confirm-password">Confirm Password</label> -->
                <input type="password" id="confirm_password" name="confirm_password" placeholder=" confirm Password"
                    required><br>

                <div class="profile-upload">
                    <label for="profile-picture">Profile Picture (Optional)</label>
                    <button id="upload_widget" class="cloudinary-button">Upload files</button>
                    <!-- <input type="file" id="profile-picture" name="profile-picture" accept="image/*"> -->

                    <div id="profile-preview"></div>
                </div>

                <div class="form-footer">
                    <button class="form-footer-btn" type="submit">Sign Up</button><br>
                    <hr>
                    <p>Already have an account ? <a href="log_in.html"> Log In</a></p>
                </div>

            </form>
        </div>
    </main>

    <script src="https://upload-widget.cloudinary.com/latest/global/all.js" type="text/javascript">
    </script>

    <script type="text/javascript">
        let profilePictureUrl = null;


        var myWidget = cloudinary.createUploadWidget({
            cloudName: 'dkf6wuffq',
            uploadPreset: 'encore'
        }, (error, result) => {
            if (!error && result && result.event === "success") {
                console.log('Done! Here is the image info: ', result.info);
                profilePictureUrl = result.info.secure_url;
            }
        }
        )

        document.getElementById("upload_widget").addEventListener("click", function () {
            myWidget.open();
        }, false);
    </script>

    <script type="module">
        import { auth, db } from './assets/js/firebase.js';
        import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const signupForm = document.getElementById("signup-form");

        async function register(email, password, fullName) {
            createUserWithEmailAndPassword(auth, email, password)
                .then(async (userCredential) => {
                    // Signed up 
                    const user = userCredential.user;

                    // Store user information in Firestore
                    await setDoc(doc(db, "users", user.uid), {
                        fullName: fullName,
                        email: email,
                        role: "student",
                        profilePicture: profilePictureUrl
                    });
                    window.location.href = "log_in.html";

                })
                .catch((error) => {
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    console.error("Error signing up:", errorCode, errorMessage);
                });
        }

        signupForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const formData = new FormData(event.target);

            const fullName = formData.get("fullname");
            const signupEmail = formData.get("email");
            const signupPassword = formData.get("password");
            const confirmPassword = formData.get("confirm_password");

            if (signupPassword === confirmPassword) {
                register(signupEmail, signupPassword, fullName);
            } else {
                alert("passwords do not match");
            }

        })


    </script>
</body>

</html>
