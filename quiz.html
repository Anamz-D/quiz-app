<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Assesment System</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #22c55e;
            --background: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            padding: 1rem;
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.99);
            /* Slight overlay effect */
            z-index: 9999;
        }

        .loading.hidden {
            display: none;
        }

        .quiz-container {
            background: var(--card);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 32rem;
            padding: 2rem;
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .quiz-title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--primary-hover));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }
        
        /* Profile info styles */
        .profile-info {
            margin-bottom: 15px;
            display: flex;
            flex-direction: row;
        }

        .profile-info label {
            font-weight: bold;
            margin-right: 10px;

        }

        .quiz-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            color: var(--muted-foreground);
            margin-bottom: 1rem;
        }

        .question {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .options {
            display: grid;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .option {
            position: relative;
            padding: 1rem;
            background: var(--background);
            border: 2px solid transparent;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option:hover {
            background: #f1f5f9;
        }

        .option.selected {
            border-color: var(--primary);
            background: #eff6ff;
        }

        .option input {
            position: absolute;
            opacity: 0;
        }

        .option label {
            display: block;
            cursor: pointer;
            font-weight: 500;
        }

        .button {
            display: block;
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            background: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .button:hover {
            background: var(--primary-hover);
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-bar {
            height: 0.5rem;
            background: #e2e8f0;
            border-radius: 1rem;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .result {
            text-align: center;
        }

        .score {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 1rem;
        }

        .option-img {
            max-width: 500px;
            max-height: 300px;
            display: block;
            margin-top: 5px;
        }

        .image-wrapper {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .question-img {
            max-width: 300px;
            max-height: 300px;
            border-radius: 6px;
            object-fit: contain;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        @media (max-width: 640px) {
            .quiz-container {
                padding: 1.5rem;
            }

            .quiz-title {
                font-size: 1.5rem;
            }

            .question {
                font-size: 1.125rem;
            }
        }
    </style>
</head>

<body>
    <main class="quiz-container">
        <div id="loading" class="loading">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="35" stroke="#000" stroke-width="10" fill="none" stroke-dasharray="164"
                    stroke-dashoffset="0">
                    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="1s"
                        repeatCount="indefinite" />
                </circle>
            </svg>
        </div>

        <div class="quiz-header">
            <h1 class="quiz-title">Assesment Time!</h1>
        </div>
        <div class="card-body" id="profileInfo" style="margin-top: 30px;margin-bottom: 30px;">
            <!-- Profile info will be inserted here by JavaScript -->
        </div>

        <section id="quiz-content">
            <div class="quiz-info">
                <span id="current-question">1 / 3</span>
                <span id="timer"></span>
            </div>

            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>

            <div class="question" id="question"></div>
            <div id="image-container" class="image-wrapper"></div>
            <div class="options" id="options"></div>
            <button class="button" id="submit-btn" disabled>Submit Answer</button>

        </section>
    </main>

    <script type="module">
        import { collection, addDoc, getDoc, getDocs, doc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { db , auth } from './assets/js/firebase.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js';


        // Global variables 
        let currentQuestion = 0;
        let score = 0;
        let selectedAnswer = null;
        let remainingTime = 0 ; //in seconds
        let quizData = [];
        let correctShuffledIndex = null;
        let userData = null;
        let currentUser = null;

        // DOM elements
        const profileInfo = document.getElementById('profileInfo');
        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const submitBtn = document.getElementById('submit-btn');
        const progressEl = document.getElementById('progress');
        const timerEl = document.getElementById('timer');
        const quizContent = document.getElementById('quiz-content');
        const loadingEl = document.getElementById('loading');

        // Event listeners
        submitBtn.addEventListener('click', handleSubmit);

        function displayUserData(data) {

            const profileHTML = `

            <div class="profile-info">
                <label>Full Name:</label>
                <span>${data.fullName || 'Not set'}</span>
            </div>
            <div class="profile-info">
                <label>Department:</label>
                <span>${data.department || 'Not set'}</span>
            </div>
            <div class="profile-info">
                <label>Matric Number:</label>
                <span>${data.matricNumber || 'Not set'}</span>
            </div>

            `;

            profileInfo.innerHTML = profileHTML;
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                try {
                    const docRef = doc(db, "users", user.uid);
                    const docSnap = await getDoc(docRef);

                    if (docSnap.exists()) {
                        userData = docSnap.data();
                        displayUserData(userData);
                    }
                } catch (error) {
                    console.error("Error fetching user data:", error);
                }
            } 
        });


        /// Helper functions

        // Decoding function for quotes and special symbols
        function decodeQuestion(question) {
            const parser = new DOMParser();
            const decodedQuestion = parser.parseFromString(question, 'text/html').documentElement.textContent;
            return decodedQuestion
        }
        // Step 2: Shuffle function
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // fetch quiz question from firebase
        async function getFirebaseQuizById(id) {
            try {
                const docRef = doc(db, "assessments", id);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    return docSnap.data();
                } else {
                    console.warn("No such document!");
                }
            } catch (error) {
                console.error("Error fetching quiz from Firebase:", error);
                return null;
            }
        }

        // Start the timer
        function startTimer() {
            const timerInterval = setInterval(() => {
                const minutes = Math.floor(remainingTime / 60);
                const seconds = remainingTime % 60;

                // Format time as MM:SS
                timerEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

                // Stop the timer when it reaches 0
                if (remainingTime <= 0) {
                    clearInterval(timerInterval);
                    showResults();
                }

                remainingTime--;
            }, 1000);
        }

        // Initialize the quiz
        async function initializeQuiz() {
            loadingEl.classList.remove('hidden'); // loading spinner

            const params = new URLSearchParams(window.location.search);
            const quizId = params.get("id");
            if (quizId) {
                const quiz = await getFirebaseQuizById(quizId);
                if (quiz) {


                    const defaultDurationMinutes = 3.5;
                    const minutes = Number(quiz.duration);
                    remainingTime = (isNaN(minutes) || minutes <= 0 ? defaultDurationMinutes : minutes) * 60;


                    quizData = quiz.questions;
                }
            }

            loadingEl.classList.add("hidden");

            if (quizData && quizData.length > 0) {
                startTimer();
                displayQuestion();
            } else {
                quizContent.innerHTML = `<p class="error">Failed to load quiz data. Please try again later.</p>`;
            }
        }

        // Display the current question
        function displayQuestion() {
            const current = quizData[currentQuestion];

            // Update question and options
            document.getElementById("current-question").textContent = `Question ${currentQuestion + 1} / ${quizData.length}`;
            questionEl.innerText = decodeQuestion(current.questionText);

            const imageContainer = document.getElementById('image-container');

            (current.questionImages || []).forEach((imgUrl) => {
                const img = document.createElement('img');
                img.src = imgUrl;
                img.alt = 'Question image';
                img.classList.add('question-img');
                imageContainer.appendChild(img);
            });


            // Step 1: Filter + Pair options with original index
            const availableOptions = current.options
                .map((option, index) => ({ option, index }))
                .filter(({ option }) => option && option.trim() !== '');

            // Step 3: Shuffle the options
            const shuffledOptions = shuffle(availableOptions);

            optionsEl.innerHTML = shuffledOptions.map(({ option }, i) => {
                const isImage = option.startsWith("http");
                return `
                    <div class="option">
                    <input type="radio" name="quiz" id="option${i}" value="${i}">
                    <label for="option${i}">
                        ${isImage ? `<img src="${option}" alt="Option ${i + 1}" class="option-img">` : option}
                    </label>
                    </div>
                `;
            }).join('');

            correctShuffledIndex = shuffledOptions.findIndex(opt => opt.index === current.correctAnswer);

            // Add event listeners to options
            const options = document.querySelectorAll('.option');
            options.forEach(option => {
                option.addEventListener('click', () => {
                    options.forEach(opt => opt.classList.remove('selected'));
                    option.classList.add('selected');
                    selectedAnswer = option.querySelector('input').value;
                    submitBtn.disabled = false;
                });
            });

            // Update progress bar
            const progress = ((currentQuestion + 1) / quizData.length) * 100;
            progressEl.style.width = `${progress}%`;
        }

        // Show final results
        function showResults() {
            const percentage = (score / quizData.length) * 100;
            quizContent.innerHTML = `
                <div class="result">
                    <div class="score">Score: ${score}/${quizData.length}</div>
                    <p>You got ${percentage.toFixed(2)}% of the questions correct!</p>
                    <button class="button" onclick="location.reload()">Restart Quiz</button>
                    <button class="button" style="margin-top:10px;" onclick="location.href='/assesment.html'"> Go home </button>
                </div>
            `;
            progressEl.style.width = '100%';
        }

        // Handle answer submission
        function handleSubmit() {
            const question = quizData[currentQuestion];
            const selectedIndex = parseInt(selectedAnswer, 10);

            if (selectedIndex === correctShuffledIndex) {
                score++;
            }

            currentQuestion++;
            selectedAnswer = null;
            correctShuffledIndex = null;
            submitBtn.disabled = true;

            if (currentQuestion < quizData.length) {
                displayQuestion();
            } else {
                showResults();
            }
        }


        // Start the quiz
        initializeQuiz();

    </script>
</body>

</html>
