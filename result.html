        .results-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 20px;

<body>
    <main>
        <header>
            <nav-bar></nav-bar>
        </header>

        <div class="results-container">
            <h1>Student Performance</h1>
            <div class="controls">
                <input type="text" id="searchMatric" placeholder="Search matric...">
                <select id="assessmentFilter">
                    <option value="">All Assessments</option>
                </select>
            </div>
            <table id="scoresTable">
                <thead>
                    <tr>
                        <th data-sort="matric">Matric Number</th>
                        <th data-sort="score">Score</th>
                        <th data-sort="date">Date Taken</th>
                        <th>Assessment</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <div class="pagination"></div>
        </div>
    </main>


    <script type="module">
        import { collection, getDocs, query, where, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { isTeacher } from "../assets/js/index.js";
        import { db, auth } from "../assets/js/firebase.js";


        async function loadScores() {
            const tableBody = document.querySelector("#scoresTable tbody");
            tableBody.innerHTML = "<tr><td colspan='3'>Loading...</td></tr>";

            try {
                const q = query(collection(db, "scores"));
                const querySnapshot = await getDocs(q);

                tableBody.innerHTML = "";

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const row = `
                    <tr>
                    <td>${data.matricNumber}</td>
                    <td>${data.score}/${data.total}</td>
                    <td>${new Date(data.takenOn?.seconds * 1000).toLocaleDateString()}</td>
                    <td>${data.assesmentTitle}</td>
                    </tr>
                `;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error("Error loading scores:", error);
                tableBody.innerHTML = "<tr><td colspan='3'>Error loading results</td></tr>";
            }
        }

        // Update DOMContentLoaded listener
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await isTeacher();
                loadScores();
            } catch (err) {
                window.location.href = '/';
            }
        });
    </script>
</body>
