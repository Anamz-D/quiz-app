        // event listeners for title, duration and description
        ['title', 'description', 'duration'].forEach(id => {
            const input = document.getElementById(id);
            input.addEventListener('blur', () => {
                quizData[id] = input.value;
            });
        });

        document.addEventListener('question-submit', (e) => {
            const newQuestion = e.detail;
            if (editingQuestionId) {
                const index = quizData.questions.findIndex(q => q.id === editingQuestionId);
                quizData.questions[index] = newQuestion;
                editingQuestionId = null;
            } else {
                quizData.questions.push(newQuestion);
            }

            questionList.data = quizData.questions;
        });

        document.addEventListener('question-edit', (e) => {
            editingQuestionId = e.detail.id;
            questionForm.question = e.detail;

        });

        document.addEventListener('question-delete', (e) => {
            const id = e.detail;
            quizData.questions = quizData.questions.filter(q => q.id !== id);
            questionList.data = quizData.questions;
        });

        document.getElementById('saveQuizBtn').addEventListener('click', async () => {
            // Add null check for assessment-image element
            const assessmentImageInput = document.getElementById('assessment-image');
            const imageUrl = assessmentImageInput ? assessmentImageInput.value : '';

            // Validate all fields
            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const duration = document.getElementById('duration').value;

            if (!title || !duration || quizData.questions.length === 0) {
                alert('Please provide a title, duration, and at least one question.');
                return;
            }

            try {
                const docRef = await addDoc(collection(db, 'assessments'), {
                    title: title,
                    description: description,
                    duration: parseFloat(duration),
                    imageUrl: imageUrl,  // Use the image URL
                    questions: quizData.questions,
                    createdAt: new Date()
                });

                alert('Assessment saved successfully!');
                // Reset and redirect
                window.location.href = './index.html';
            } catch (error) {
                console.error('Error saving assessment:', error);
                alert('Failed to save assessment. Please try again.');
            }
        });
