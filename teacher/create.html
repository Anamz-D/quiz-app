<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script type="module" src="../assets/js/index.js" async defer></script>
    <link rel="stylesheet" href="../assets/styles/base.css">
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</head>

<body>
    <nav-bar></nav-bar>
    <div>
        <label for="title">Quiz Title</label>
        <input type="text" id="title" required />
    </div>
    <div>
        <label for="description">Description (optional)</label>
        <textarea id="description" rows="3"></textarea>
    </div>
    <div>
        <label for="assessment-image">Assessment Image (Optional)</label>
        <button id="assessmentUploadWidget" class="cloudinary-button">Upload Image</button>
        <input type="hidden" id="assessment-image" name="assessment-image">
        <div id="assessment-image-preview"></div>
    </div>
    <question-form></question-form>
    <question-list></question-list>

    <button id="saveQuizBtn">Save Quiz</button>


    <script type="module">
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { db } from '../assets/js/firebase.js';
        import { isTeacher } from '../assets/js/index.js';
        // Cloudinary configuration
        const cloudName = 'dkf6wuffq';
        const uploadPreset = 'encore';

        // Initialize Cloudinary widget for assessment image
        const assessmentWidget = cloudinary.createUploadWidget({
            cloudName: dkf6wuffq,
            uploadPreset: encore,
            folder: 'assessment-images',
            multiple: false,
            resourceType: 'image',
            clientAllowedFormats: ['jpg', 'png', 'jpeg', 'gif'],
            maxImageFileSize: 5000000 // 5MB
        }, (error, result) => {
            if (!error && result && result.event === "success") {
                document.getElementById('assessment-image').value = result.info.secure_url;
                document.getElementById('assessment-image-preview').innerHTML = `
                <img src="${result.info.secure_url}" width="200" style="max-height: 200px; object-fit: contain;"/>
            `;
            }
        });

        document.getElementById("assessmentUploadWidget").addEventListener("click", function (e) {
            e.preventDefault();
            assessmentWidget.open();
        });

        // Check if the user is a teacher
        window.addEventListener('DOMContentLoaded', async () => {
            await isTeacher();
        });
        const quizData = { title: '', description: '',imageUrl: '', questions: [] };
        const questionForm = document.querySelector('question-form');
        const questionList = document.querySelector('question-list');

        let editingQuestionId = null;

        // event listeners for title and description
        ['title', 'description'].forEach(id => {
            const input = document.getElementById(id);
            input.addEventListener('blur', () => {
                quizData[id] = input.value;
            });
        });

        document.addEventListener('question-submit', (e) => {
            const newQuestion = e.detail;

            if (editingQuestionId) {
                const index = quizData.questions.findIndex(q => q.id === editingQuestionId);
                quizData.questions[index] = newQuestion;
                editingQuestionId = null;
            } else {
                quizData.questions.push(newQuestion);
            }

            questionList.data = quizData.questions;
        });

        document.addEventListener('question-edit', (e) => {
            editingQuestionId = e.detail.id;
            questionForm.question = e.detail;

        });

        document.addEventListener('question-delete', (e) => {
            const id = e.detail;
            quizData.questions = quizData.questions.filter(q => q.id !== id);
            questionList.data = quizData.questions;
        });

        // // Save quiz data to Firestore
        // document.getElementById('saveQuizBtn').addEventListener('click', async () => {
        //     quizData.imageUrl = document.getElementById('assessment-image').value;
        //     if (!quizData.title || quizData.questions.length === 0) {
        //         alert('Please provide a title, description, and at least one question.');
        //         return;

        //     try {

        //             title: quizData.title,
        //             description: quizData.description,
        //             imageUrl: quizData.imageUrl,
        //             questions: quizData.questions,
        //             createdAt: new Date()
        //         });

        //         alert('Quiz saved successfully! ID: ' + docRef.id);
        //         // Reset if you want
        //         quizData.title = '';
        //         quizData.description = '';
        //         quizData.imageUrl = '';
        //         quizData.questions = [];
        //         questionList.data = [];
        //         questionForm.reset(); // Add a reset() method to your component if needed
        //         document.getElementById('assessment-image-preview').innerHTML = '';

        //     } catch (error) {
        //         console.error('Error saving quiz:', error);
        //         alert('Failed to save quiz. Please try again.');
        //     }
        // });

        

        // Update save handler
        document.getElementById('saveQuizBtn').addEventListener('click', async () => {
            // Capture image URL
            quizData.imageUrl = document.getElementById('assessment-image').value;
            
            // Update validation
            if (!quizData.title.trim()) {
                alert('Please provide a title');
                return;
            }
            
            if (quizData.questions.length === 0) {
                alert('Please add at least one question');
                return;
            }

            try {
                // For create.html
                const docRef = await addDoc(collection(db, 'assessments'), {
                    title: quizData.title,
                    description: quizData.description,
                    imageUrl: quizData.imageUrl,
                    questions: quizData.questions,
                    createdAt: new Date()
                });

                // For update.html
                // await updateDoc(quizRef, {
                //     title: quizData.title,
                //     description: quizData.description,
                //     imageUrl: quizData.imageUrl,
                //     questions: quizData.questions,
                //     updatedAt: new Date()
                // });

                alert('Assessment saved successfully!');
                window.location.href = './index.html';
            } catch (error) {
                console.error('Error saving assessment:', error);
                alert('Error saving assessment: ' + error.message);
            }
        });
    </script>



</body>
